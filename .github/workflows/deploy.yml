# Deploys a commit of main to the demo server (stage 6, ADR 0012; design:
# docs/plans/2026-11-19-stage-6-cd.md). Runs after the images workflow has smoke-tested and
# pushed that commit's ARM64 images, and waits for the owner's approval in the GitHub
# environment "demo". No AWS keys are stored anywhere: the job swaps GitHub's OIDC token for
# one-hour credentials of a role that may only run commands on the demo server.
#
# Flow: deploy hold → credentials → server running? → note the running release → backup →
# deploy → live check. If the deploy or the live check fails, it redeploys the release that
# was running before, checks again, and the job stays red.
#
# Run by hand (Actions → deploy → Run workflow) to deploy any commit already on main, which is
# also the manual rollback. The same approval applies. An automatic run never deploys a commit
# older than the running one (images runs can finish out of order); a run by hand may.
#
# Each run is named after its commit, so the list of green runs is the list of releases that
# went live: to roll back by hand, run this with the commit of the green run before the bad one.
name: deploy
run-name: deploy ${{ github.event.workflow_run.head_sha || inputs.commit || 'main' }}

on:
  workflow_run:
    workflows: [images]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit on main to deploy (full or short hash; empty for the newest)
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    # From the images workflow: only when it succeeded, for a commit on main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # One deploy at a time, never cancelled half-way. A newer deploy waiting in the queue
    # replaces an older one that hasn't started: only the newest commit is worth deploying.
    # On the job, not the workflow: a run whose job is skipped (images failed, or ran off main)
    # must not join the queue and replace a real deploy waiting there.
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    # Above the worst case, so a timeout can never cut a rollback short (a job timeout cancels
    # the job, and a cancelled job skips the rollback step): each slow step has its own limit,
    # and a step that hits it fails, which the rollback does see. Worst case: release 3 +
    # backup 20 + deploy 20 + live check 6 + rollback 25 = 74 minutes, plus a few for setup.
    timeout-minutes: 85
    # The approval click: the environment requires the owner as reviewer and accepts main only.
    environment:
      name: demo
      url: https://business-software.duckdns.org
    permissions:
      contents: read
      # To ask GitHub for the OIDC token AWS trusts (infra/terraform/demo/deploy.tf).
      id-token: write
      # To check the images exist on GHCR before telling the server to pull them.
      packages: read
    env:
      DEMO_INSTANCE_ID: ${{ vars.DEMO_INSTANCE_ID }}
    steps:
      # Fails closed: deploys only while DEPLOY_HOLD is exactly "off". Unset (the environment
      # isn't set up yet) or any other text (the reason for the hold) stops here, before AWS.
      - name: Deploy hold
        env:
          DEPLOY_HOLD: ${{ vars.DEPLOY_HOLD }}
        run: |
          if [[ $DEPLOY_HOLD != off ]]; then
            echo "::error::Deploy hold: ${DEPLOY_HOLD:-DEPLOY_HOLD is not set}"
            exit 1
          fi
          [[ $DEMO_INSTANCE_ID =~ ^i-[0-9a-f]+$ ]] ||
            { echo "::error::Variable DEMO_INSTANCE_ID is not set"; exit 1; }

      # Every branch, so demo.sh can check the commit is on main (origin/main).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # The same check demo.sh makes (scripts/deploy/lib.sh), done first so nothing else runs
      # for a commit that isn't on main.
      - name: Which commit
        id: commit
        env:
          FROM_IMAGES: ${{ github.event.workflow_run.head_sha }}
          FROM_INPUT: ${{ inputs.commit }}
        run: |
          source scripts/deploy/lib.sh
          sha=$(main_commit "${FROM_IMAGES:-${FROM_INPUT:-origin/main}}")
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "Deploying $sha: $(git log -1 --format=%s "$sha")"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ap-south-1

      # The server and RDS are stopped outside sessions (ADR 0033). The deploy role may not
      # start them: a person does, RDS first, then approves again.
      - name: Is the server running
        run: |
          state=$(aws ec2 describe-instances --instance-ids "$DEMO_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          [[ $state == running ]] ||
            { echo "::error::The server is $state: start RDS, then the server, then run this again"; exit 1; }

      # What runs now is what a failed deploy goes back to. Empty on a server's first release.
      - name: Note the running release
        id: previous
        timeout-minutes: 3
        run: |
          previous=$(scripts/deploy/current-release.sh)
          echo "sha=$previous" >>"$GITHUB_OUTPUT"
          echo "Running now: ${previous:-nothing}"

      # Images runs can finish out of order: an automatic deploy never takes the server back to
      # an older commit. A run by hand may (that is the manual rollback).
      - name: Not older than the running release
        if: github.event_name == 'workflow_run'
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          RUNNING: ${{ steps.previous.outputs.sha }}
        run: |
          source scripts/deploy/lib.sh
          not_older_than_running "$SHA" "$RUNNING"

      # Before anything changes (ADR 0037). If it fails, nothing is deployed. The server stops
      # a backup at 15 minutes; the step limit adds room for the polling.
      - name: Back up the database
        timeout-minutes: 20
        run: scripts/deploy/backup.sh before-deploy

      - name: Deploy
        id: deploy
        timeout-minutes: 20
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: scripts/deploy/demo.sh "$SHA"

      # Three tries (scripts/deploy/check-live.sh waits 15 s between them, not after the last).
      - name: Check the live site
        id: live
        timeout-minutes: 6
        run: scripts/deploy/check-live.sh --tries 3

      # Rollback: the previous release's images on the new schema, which works because every
      # migration is expand-then-contract (a step that drops what the old release uses waits
      # for a later release). The job stays red so the failure is seen.
      # Only to a different commit: going "back" to the commit that just failed (a rerun of
      # the running release) would redeploy it and could report it live.
      - name: Roll back to the release that was running
        if: >-
          failure() && steps.previous.outputs.sha != '' &&
          steps.previous.outputs.sha != steps.commit.outputs.sha &&
          (steps.deploy.conclusion == 'failure' || steps.live.conclusion == 'failure')
        timeout-minutes: 25
        env:
          PREVIOUS: ${{ steps.previous.outputs.sha }}
        run: |
          echo "::error::Deploy failed: rolling back to $PREVIOUS"
          scripts/deploy/demo.sh "$PREVIOUS"
          if scripts/deploy/check-live.sh --tries 3; then
            echo "::error::Rolled back to $PREVIOUS, which is live; the failed commit is not"
          else
            echo "::error::Rolled back to $PREVIOUS, but the live check still fails: look now"
          fi
          exit 1
