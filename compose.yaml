# Local services. `pnpm db:up` starts only the database (for `pnpm dev`); `pnpm app:up`
# starts everything. See docs/devops/local-database.md.
name: business-software

# The api, worker and migrate services run the same image with different commands.
x-app: &app
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: business-software-app:local
  # A tiny init process as PID 1 passes Docker's stop signal on to Node.
  init: true

services:
  db:
    # Same major version as RDS (ADR 0005). packages/db/src/roles.test.ts reads this line.
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?set APP_OWNER_PASSWORD in .env}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD in .env}
    ports:
      # This computer only, never the shop's Wi-Fi.
      - 127.0.0.1:5432:5432
    volumes:
      # PostgreSQL 18 keeps its data in /var/lib/postgresql/18/docker, so mount the parent.
      - pgdata:/var/lib/postgresql
      # Runs only when pgdata is empty.
      - ./packages/db/bootstrap/create-roles.sql:/docker-entrypoint-initdb.d/10-create-roles.sql:ro
    healthcheck:
      # TCP, not the socket: during first-start init the server listens on the socket only,
      # so this turns healthy only once the roles and database exist.
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, app_owner, -d, business_software]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: applies migrations as the owner role, then exits. api and worker wait for it.
  migrate:
    <<: *app
    command: [node, dist/migrate.js]
    environment:
      MIGRATION_DATABASE_URL: postgresql://app_owner:${APP_OWNER_PASSWORD}@db:5432/business_software
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    environment:
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_PASSWORD}@db:5432/business_software
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      # Liveness only: restarting the api wouldn't fix a database outage. The slim image has
      # no curl, so Node itself makes the request.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: [node, dist/worker.js]
    environment:
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_PASSWORD}@db:5432/business_software
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
