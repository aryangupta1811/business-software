# Local services. `pnpm db:up` starts the database and Mailpit (for `pnpm dev`); `pnpm app:up`
# starts everything. See docs/devops/local-database.md.
name: business-software

# The api, worker and migrate services run the same image with different commands.
x-app: &app
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: business-software-app:local
  # A tiny init process as PID 1 passes Docker's stop signal on to Node.
  init: true

services:
  db:
    # Same major version as RDS (ADR 0005). packages/db/src/testing.ts reads this line.
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?set APP_OWNER_PASSWORD in .env}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD in .env}
      APP_QUEUE_PASSWORD: ${APP_QUEUE_PASSWORD:?set APP_QUEUE_PASSWORD in .env}
    ports:
      # This computer only, never the shop's Wi-Fi.
      - 127.0.0.1:5432:5432
    volumes:
      # PostgreSQL 18 keeps its data in /var/lib/postgresql/18/docker, so mount the parent.
      - pgdata:/var/lib/postgresql
      # Run only when pgdata is empty, in name order. A volume made before the backup or queue
      # role existed needs that file once by hand (docs/devops/local-database.md).
      - ./packages/db/bootstrap/create-roles.sql:/docker-entrypoint-initdb.d/10-create-roles.sql:ro
      - ./packages/db/bootstrap/create-backup-role.sql:/docker-entrypoint-initdb.d/20-create-backup-role.sql:ro
      - ./packages/db/bootstrap/create-queue-role.sql:/docker-entrypoint-initdb.d/30-create-queue-role.sql:ro
    healthcheck:
      # TCP, not the socket: during first-start init the server listens on the socket only,
      # so this turns healthy only once the roles and database exist.
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, app_owner, -d, business_software]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: applies migrations as the owner role, then exits. api and worker wait for it.
  migrate:
    <<: *app
    command: [node, dist/migrate.js]
    environment:
      MIGRATION_DATABASE_URL: postgresql://app_owner:${APP_OWNER_PASSWORD}@db:5432/business_software
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    environment:
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_PASSWORD}@db:5432/business_software
      # Every interface inside the container; the port below is published on 127.0.0.1 only.
      HOST: 0.0.0.0
      # Email goes to Mailpit (ADR 0040); links open the web service below.
      MAIL_TRANSPORT: smtp
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: no-reply@example.test
      APP_URL: http://127.0.0.1:8080
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      # Liveness only: restarting the api wouldn't fix a database outage. The slim image has
      # no curl, so Node itself makes the request.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: [node, dist/worker.js]
    environment:
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_PASSWORD}@db:5432/business_software
      # The job queue's own login (ADR 0022). Only the worker gets it, never the api (ADR 0021).
      QUEUE_DATABASE_URL: postgresql://app_queue:${APP_QUEUE_PASSWORD}@db:5432/business_software
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Caddy: the web app's files, and /api passed on to the api service.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: business-software-web:local
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    # No depends_on: if the api is down, the page still loads and says it can't reach the
    # server, which is what the connection badge is for.

  # Catches every email the app sends on this computer (ADR 0040); read them at
  # http://127.0.0.1:8025. Nothing leaves the computer. Pinned by digest, like a lockfile.
  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
