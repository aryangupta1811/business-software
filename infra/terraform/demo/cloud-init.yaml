#cloud-config
# Runs once, at the server's first boot. Changing this file replaces the server
# (server.tf: user_data_replace_on_change). No secrets in here: user data is readable
# by anyone who can describe the instance.

package_update: true
package_upgrade: true

# 2 GB of swap: the t4g.small has 2 GB of RAM, and a build or a spike shouldn't kill a container.
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

# Docker from Docker's own apt repository (Ubuntu's docker.io package lags behind and
# has no Compose plugin). Key fingerprint from docs.docker.com.
apt:
  sources:
    docker.list:
      source: 'deb [arch=arm64 signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable'
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - unattended-upgrades

write_files:
  # Security updates install by themselves, but never reboot the server by surprise:
  # it restarts at every session start anyway.
  - path: /etc/apt/apt.conf.d/52business-software
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";

runcmd:
  - systemctl enable --now docker
  # The AWS CLI reads SSM parameters at boot (part 3). Ubuntu ships it as a snap.
  - snap install aws-cli --classic
