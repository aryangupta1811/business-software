# Continuous integration (ADRs 0012, 0024): every pull request and every push to main is
# checked on a clean Linux machine. All jobs are required checks in the protect-main ruleset.
# The PR-title check is its own workflow (pr-title.yml), because it must also run on a rename.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read the code, nothing else: a hijacked step can't push, comment or touch releases.
# Never pull_request_target: it runs with the base repository's rights (docs/devops/secrets.md).
permissions:
  contents: read

# A new push to a PR cancels its older run. On main a running build is never cancelled (a
# queued one can be replaced by a newer push, whose run then covers both commits).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to a commit SHA, because a tag can be moved to other code.
# Dependabot keeps the pins current (.github/dependabot.yml).
jobs:
  # Everything `pnpm check` runs, plus the build. The integration tests start PostgreSQL with
  # Testcontainers, exactly as on the laptop (ADR 0013).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm at the version in package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The deploy scripts' own logic (stage 6), with a fake site and a throwaway repository.
      - name: Test the deploy scripts
        run: scripts/deploy/test.sh
      - name: Lint the workflows
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      # Terraform (ADR 0031): formatting and a validate of each root, with no AWS access.
      # `-backend=false` skips the state bucket; `-lockfile=readonly` fails if the committed
      # .terraform.lock.hcl doesn't match the providers the code asks for.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Check Terraform
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive -diff
          for root in bootstrap demo; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done

  # gitleaks over the whole history: push protection only knows well-known token formats.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The container's user doesn't own the runner's files, so git would refuse the folder
      # ("dubious ownership") without the safe.directory setting passed through env.
      - name: Scan for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact -v

  # Drizzle silently skips a migration older than the newest applied one (ADR 0021).
  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Node 24 runs the TypeScript file directly (type stripping), so no install is needed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check migration order against the base branch
        run: node packages/db/scripts/check-migration-order.ts "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  # The real images, started the way `pnpm app:up` starts them, then poked from outside.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both images built at once and smoke-tested; the images workflow runs the same action
      # on ARM64 before it pushes.
      - uses: ./.github/actions/smoke
        with:
          arch: amd64
