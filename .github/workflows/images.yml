# Publishes the two images for every commit on main (ADR 0034): built on GitHub's ARM64
# runner for the Graviton server, smoke-tested, then pushed to GitHub Container Registry,
# tagged with the commit hash. The deploy workflow (stage 6) deploys a commit by that tag.
# Not a required check: it runs after the merge, on main only. Never on pull requests, so
# code that hasn't been reviewed can't push an image.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish per commit; a newer push doesn't cancel an older one (each tag must exist).
concurrency:
  group: images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    # workflow_dispatch can name any branch: publish only from main, which changes only
    # through reviewed pull requests.
    if: github.ref == 'refs/heads/main'
    # Free for public repositories. Native ARM64: no emulation, and the image built here is
    # the architecture the server runs.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      # Only this job may write packages, with a token that expires when the job ends.
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Stage 6: the image that runs on the server must be the image that was tested (CI's
      # smoke job tests x86 builds of pull requests). So both are built into the local Docker
      # first, under the names compose.yaml uses, smoke-tested, and only then pushed.
      - name: Build the app image (api, worker, migrate)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          load: true
          tags: business-software-app:local
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=business-software-app-arm64
          cache-to: type=gha,mode=max,scope=business-software-app-arm64
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          load: true
          tags: business-software-web:local
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=business-software-web-arm64
          cache-to: type=gha,mode=max,scope=business-software-web-arm64
      # The same smoke test as CI, on these exact images. The example's fake passwords are
      # fine for a database thrown away after the job.
      - run: cp .env.example .env
      - run: docker compose up -d --wait --wait-timeout 180 --no-build --quiet-pull
      - run: scripts/ci/smoke.sh
      - name: Container logs
        # Also on a timeout, which cancels the job instead of failing a step.
        if: failure() || cancelled()
        run: docker compose logs --no-color
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The owner name must be lowercase in an image name; this repository's already is.
      - name: Push the tested images
        run: |
          for image in business-software-app business-software-web; do
            docker tag "$image:local" "$REGISTRY/$image:$GITHUB_SHA"
            docker push --quiet "$REGISTRY/$image:$GITHUB_SHA"
          done
