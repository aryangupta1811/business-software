# Keeps the SHA-pinned actions in .github/workflows current: one grouped PR a month.
# npm dependencies are updated by hand (one-day minimumReleaseAge, ADR 0018).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
